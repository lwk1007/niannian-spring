# 本地开发：H2 文件库，MySQL 兼容模式，不需要装数据库
spring:
  datasource:
    url: jdbc:h2:file:./data/niannian;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    site.niannian: DEBUG
