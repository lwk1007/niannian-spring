# 生产：MySQL。微信云托管会注入 MYSQL_ADDRESS / MYSQL_USERNAME / MYSQL_PASSWORD，
# 也支持自己用 DB_HOST / DB_NAME / DB_USER / DB_PASSWORD 覆盖。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:${MYSQL_ADDRESS:127.0.0.1:3306}}/${DB_NAME:${MYSQL_DATABASE:niannian}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:${MYSQL_USERNAME:root}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    site.niannian: INFO
