spring:
  application:
    name: niannian-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    # Jackson 3 已把 WRITE_DATES_AS_TIMESTAMPS 移出 SerializationFeature，
    # 默认就是 ISO-8601 字符串，无需显式配置。

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
  error:
    include-message: always

# 大模型写信：接 OpenAI 兼容的 /chat/completions（Ollama / DeepSeek / 通义 / Kimi 等）。
# 未配置 base-url 或 model 时，「一封信」退回模板写信，不影响使用。
niannian:
  ai:
    base-url: ${NIANNIAN_AI_BASE_URL:}
    api-key: ${NIANNIAN_AI_API_KEY:}
    model: ${NIANNIAN_AI_MODEL:}
    timeout-seconds: ${NIANNIAN_AI_TIMEOUT:45}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    site.niannian: DEBUG
